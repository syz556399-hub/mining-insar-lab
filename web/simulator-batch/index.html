<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>矿区干涉模拟器 2.0 · 批量样本</title>
<style>
:root{color-scheme:light;font:15px system-ui,-apple-system,sans-serif;color:#253b3e;background:#f1f5f3}*{box-sizing:border-box}body{margin:0}header,main{max-width:1320px;margin:auto;padding:24px}header{background:#fff;border-bottom:1px solid #d7e2df}h1{font-size:27px;margin:8px 0 12px}h2{font-size:20px}p{line-height:1.7;margin:8px 0}.badge{color:#30685c;font-weight:600}.note{padding:12px 16px;border-radius:10px;background:#e6efeb}.tools{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}select,button,a.action{font:inherit;border:1px solid #b8cec5;border-radius:7px;background:white;padding:8px 12px;color:#274e43}button{cursor:pointer}button.active{background:#346a5a;color:white}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:14px}.card{padding:8px;text-align:left;border-radius:12px;overflow:hidden}.card img{display:block;width:100%;image-rendering:auto;border-radius:5px}.card strong,.card small{display:block;margin:6px 4px}.card small{color:#5b716a}.detail{background:white;border:1px solid #d7e2df;border-radius:12px;padding:16px;margin:0 0 22px}.panels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.panels img{width:100%;image-rendering:pixelated}.panels span{display:block;margin:6px 0;color:#506860}.paging{display:flex;align-items:center;gap:12px;margin:20px 0}.muted{color:#687973;font-size:13px}a{color:#346a5a}footer{padding:20px;text-align:center;color:#687973;font-size:13px}@media(max-width:600px){header,main{padding:16px}.panels{grid-template-columns:1fr 1fr}.panels figure{margin:0}.panels figure:last-child{max-width:180px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}h1{font-size:23px}}
</style></head><body><header><div class="badge">采掘干涉实验室 · 2.0</div><h1>批量矿区干涉样本</h1><p id="summary">正在读取样本…</p><p class="note">沿用已确认的生成风格。白线表示程序生成的候选外缘，新样本尚未逐张人工确认；可先抽查影像和完整条纹范围。</p></header><main>
<section class="detail" id="detail" hidden><h2 id="detail-title"></h2><p class="muted" id="detail-info"></p><div class="panels"><figure><span>原始影像</span><img id="original" alt="当前合成干涉影像"></figure><figure><span>候选外缘</span><canvas id="outline" role="img" aria-label="程序生成的候选沉降边界" style="width:100%;image-rendering:pixelated"></canvas></figure><figure><span>二值标签</span><img id="mask" alt="当前二值分割标签"></figure></div><p id="downloads"></p></section>
<div class="tools"><select id="case" aria-label="场景类型"><option value="all">所有场景</option><option value="single">单盆地</option><option value="overlap">双盆地重叠</option><option value="separated">双盆地分离</option><option value="edge">边缘截断</option><option value="small">小范围沉降</option><option value="negative">只有背景</option></select><select id="split" aria-label="数据划分"><option value="all">全部划分</option><option value="train">训练部分</option><option value="val">验证部分</option><option value="test">合成测试部分</option></select><select id="water" aria-label="水体筛选"><option value="all">全部环境</option><option value="no">无水体</option><option value="yes">含合成水体</option></select><select id="quality" aria-label="采样提示筛选"><option value="all">全部采样情况</option><option value="warning">有采样提示，重点检查</option><option value="clear">无采样提示</option></select></div><p class="muted" id="count"></p><div class="grid" id="grid"></div><div class="paging"><button id="prev">上一页</button><span id="page"></span><button id="next">下一页</button></div><p class="muted">每页 20 张，点击任意样本看原图、外缘与标签。划分以独立场景为组；标签不会按水体自动删除，也不会自动填洞。</p></main><footer>本机查看 · 合成 DEM、水体与经验观测模型 · 尚未检验真实影像识别效果</footer>
<script>
const $=id=>document.getElementById(id),names={single:'单盆地',overlap:'双盆地重叠',separated:'双盆地分离',edge:'边缘截断',small:'小范围沉降',negative:'只有背景'};let doc,filtered=[],page=0,token=0;
async function show(row){const current=++token;$('detail').hidden=false;$('detail-title').textContent=`${row.id} · ${names[row.case]}`;$('detail-info').textContent=`256 × 256 · ${row.split} · ${row.water_percent>0?'含合成水体':'无水体'} · 自动标签占比 ${row.label_percent.toFixed(1)}% · 待人工抽查${row.warnings.length?" · 相位变化较快，可能混叠，请重点检查":""}`;$('original').src=row.image;$('mask').src=row.mask;const img=new Image(),mask=new Image();await Promise.all([new Promise((yes,no)=>{img.onload=yes;img.onerror=no;img.src=row.image}),new Promise((yes,no)=>{mask.onload=yes;mask.onerror=no;mask.src=row.mask})]);if(current!==token)return;const canvas=$('outline');canvas.width=canvas.height=256;const ctx=canvas.getContext('2d');ctx.drawImage(mask,0,0);const pixels=ctx.getImageData(0,0,256,256).data,edge=[];for(let y=0;y<256;y++)for(let x=0;x<256;x++){const i=y*256+x;if(pixels[i*4]>0&&(x===0||y===0||x===255||y===255||pixels[(i-1)*4]===0||pixels[(i+1)*4]===0||pixels[(i-256)*4]===0||pixels[(i+256)*4]===0))edge.push([x,y])}ctx.drawImage(img,0,0);ctx.fillStyle='black';for(const [x,y]of edge)ctx.fillRect(x-1,y-1,3,3);ctx.fillStyle='white';for(const [x,y]of edge)ctx.fillRect(x,y,1,1);$('downloads').replaceChildren();for(const [label,path]of [['下载影像',row.image],['下载标签',row.mask],['查看参数',row.metadata],['LabelMe 标注',row.labelme]]){const a=document.createElement('a');a.textContent=label;a.href=path;a.download=path.split('/').pop();a.style.marginRight='18px';$('downloads').append(a)}}
function render(){filtered=doc.samples.filter(r=>($('case').value==='all'||r.case===$('case').value)&&($('split').value==='all'||r.split===$('split').value)&&($('water').value==='all'||(r.water_percent>0)===($('water').value==='yes'))&&($('quality').value==='all'||(r.warnings.length>0)===($('quality').value==='warning')));const pages=Math.max(1,Math.ceil(filtered.length/20));page=Math.min(page,pages-1);$('grid').replaceChildren();for(const row of filtered.slice(page*20,page*20+20)){const b=document.createElement('button');b.className='card';b.setAttribute('aria-label',`${row.id} ${names[row.case]} 查看影像与边界`);const img=new Image();img.src=row.image;img.loading='lazy';img.alt='';const title=document.createElement('strong');title.textContent=`${row.id} · ${names[row.case]}`;const info=document.createElement('small');info.textContent=`${row.split} · ${row.water_percent>0?'含水体':'无水体'} · 自动标签`;b.append(img,title,info);b.onclick=()=>{show(row);$('detail').scrollIntoView({behavior:'smooth',block:'start'})};$('grid').append(b)}$('count').textContent=`筛选后 ${filtered.length} 张`;$('page').textContent=`${page+1} / ${pages} 页`;$('prev').disabled=page===0;$('next').disabled=page===pages-1}
for(const id of ['case','split','water','quality'])$(id).onchange=()=>{page=0;render()};$('prev').onclick=()=>{page--;render()};$('next').onclick=()=>{page++;render()};fetch('manifest.json').then(r=>{if(!r.ok)throw Error('读取失败');return r.json()}).then(d=>{doc=d;const counts={};d.samples.forEach(r=>counts[r.split]=(counts[r.split]||0)+1);$('summary').textContent=`已生成 ${d.samples.length} 张 · 训练 ${counts.train||0} / 验证 ${counts.val||0} / 合成测试 ${counts.test||0} · 256 × 256 · ${d.samples.filter(r=>r.warnings.length).length} 张有采样提示`;render();if(d.samples.length)show(d.samples[0])}).catch(e=>{$('summary').textContent=`无法读取样本：${e.message}`});
</script></body></html>
