name: numerical-tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  numerical:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m unittest discover -v
      - run: python simulator_review.py build --run runs/review_ci
      - run: python cli.py dataset --count 50 --out exports/ci_smoke
      - run: python validate_dataset.py exports/ci_smoke
      - run: python diagnostics.py --out exports/diagnostics.json
  training-cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install 'torch>=2.2,<3' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m unittest test_training -v
      - run: python -m unittest test_phase_encoding -v
      - run: python -m unittest test_mine_learning test_detection_first test_detection_study test_real_detection_eval test_real_labels -v
      - run: python cli.py dataset --config examples/training_quick.json --count 50 --out exports/training_smoke
      - run: python validate_dataset.py exports/training_smoke
      - run: python train.py --data exports/training_smoke --out runs/training_smoke --input rgb --base 8 --epochs 2 --device cpu
      - run: python train.py --data exports/training_smoke --out runs/training_phase_smoke --input phase --phase-bins 16 --phase-augment --base 8 --epochs 2 --device cpu
